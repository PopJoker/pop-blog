<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>部落格管理後台</title>

    <!-- Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script>
        // 🔥 指定 Identity API（這行是關鍵）
        window.netlifyIdentity = window.netlifyIdentity || {};
        window.netlifyIdentity.on = window.netlifyIdentity.on || function () { };

        // 等 widget 載入後設定 API
        document.addEventListener("DOMContentLoaded", function () {
            if (window.netlifyIdentity) {
                window.netlifyIdentity.init({
                    APIUrl: "https://remarkable-selkie-7decfb.netlify.app/.netlify/identity"
                });
            }
        });
    </script>
</head>

<body>
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/pop-blog/admin/";
                    });
                }
            });
        }
    </script>
</body>

</html>
