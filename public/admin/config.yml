backend:
  name: git-gateway
  repo: PopJoker/pop-blog # 換成你的 Repo 路徑
  branch: main # 或是你主要的分支名稱

media_folder: "public/static/images" # 圖片上傳存放路徑
public_folder: "/static/images"      # 文章中引用的路徑

collections:
  - name: "blog"
    label: "文章"
    folder: "data/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "發布日期", name: "date", widget: "datetime" }
      - { label: "標籤", name: "tags", widget: "list" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "摘要", name: "summary", widget: "text" }
      - { label: "內文", name: "body", widget: "markdown" }