backend:
  name: github
  repo: PopJoker/pop-blog
  branch: main
  base_url: https://decap-cms-oauth.vercel.app
  auth_endpoint: auth

media_folder: 'public/static/images'
public_folder: 'public/static/images'

collections:
  - name: 'blog'
    label: 'Blog'
    folder: 'data/blog'
    create: true
    slug: '{{fields.slug}}'
    extension: mdx
    format: frontmatter

    fields:
      - { label: '標題', name: 'title', widget: 'string' }

      - { label: '網址 Slug', name: 'slug', widget: 'string' }

      - { label: '發布日期', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD' }

      - { label: '摘要', name: 'summary', widget: 'text' }

      - { label: '封面圖', name: 'cover', widget: 'image', required: false }

      - { label: '標籤', name: 'tags', widget: 'list' }

      - {  label: '作者', name: 'authors', widget: 'list' ,default: ['default'] }

      - { label: '是否草稿', name: 'draft', widget: 'boolean', default: false }

      - { label: '內容', name: 'body', widget: 'markdown' }

  - name: 'settings'
    label: '設定'
    delete: false # 不允許刪除整個檔案
    editor:
      preview: false
    files:
      - name: 'projects'
        label: '專案管理 (Projects)'
        file: 'data/projectsData.json'
        fields:
          - label: '所有專案'
            name: 'projects' # 注意：這會讓 JSON 變成 { "projects": [...] }，稍後說明
            widget: 'list'
            allow_add: true
            fields:
              - { label: '標題', name: 'title', widget: 'string' }
              - { label: '描述', name: 'description', widget: 'text' }
              - { label: '圖片路徑', name: 'imgSrc', widget: 'image', required: false }
              - { label: '連結 (URL)', name: 'href', widget: 'string', required: false }
              - { label: '標籤', name: 'tags', widget: 'list' }