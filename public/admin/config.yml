backend:
  name: git-gateway
  repo: PopJoker/pop-blog
  branch: main
  # 強制指向 Netlify 的身分驗證網址
  identity_url: "https://remarkable-selkie-7decfb.netlify.app/.netlify/identity"
  gateway_url: "https://remarkable-selkie-7decfb.netlify.app/.netlify/git"

media_folder: "public/static/images"
public_folder: "/static/images"

collections:
  - name: "blog"
    label: "文章"
    folder: "data/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "發布日期", name: "date", widget: "datetime" }
      - { label: "標籤", name: "tags", widget: "list" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "摘要", name: "summary", widget: "text" }
      - { label: "內文", name: "body", widget: "markdown" }